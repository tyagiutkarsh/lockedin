<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dashboard.css">
    <title>locked in - Dashboard</title>
</head>
<body>
    <div class="container">
        <header class="tabs">
            <button class="tab-link active" data-tab="insights">Insights</button>
            <button class="tab-link" data-tab="settings">Settings</button>
        </header>

        <main>
            <!-- Insights Tab Content -->
            <div id="insights" class="tab-content active">
                <div id="chart-container">
                    <!-- Chart will be rendered here by Chart.js -->
                    <canvas id="usageChart"></canvas>
                </div>
                <div id="reasons-table-container">
                    <h3>Session Intentions</h3>
                    <table id="reasons-table">
                        <thead>
                            <tr>
                                <th>Website</th>
                                <th>Reason</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Reasons will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Settings Tab Content -->
            <div id="settings" class="tab-content">
                <div class="settings-section">
                    <label for="timer-duration">Session Duration (minutes)</label>
                    <input type="number" id="timer-duration" min="1" max="60">
                </div>
                <div class="settings-section">
                    <label for="new-site">Add a blocked website (e.g., netflix.com)</label>
                    <form id="add-site-form">
                        <input type="text" id="new-site" placeholder="example.com">
                        <button type="submit">Add</button>
                    </form>
                </div>
                <div class="settings-section">
                    <label>Blocked Websites</label>
                    <ul id="blocked-sites-list">
                        <!-- List will be populated here -->
                    </ul>
                </div>
            </div>
        </main>
    </div>
    <script src="../lib/chart.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
