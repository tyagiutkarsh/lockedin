<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>locked in</title>
    <link rel="stylesheet" href="block.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>locked in</h1>
        </header>
        <main>
            <p class="prompt-text">State your intention for accessing <span id="site-name">this website</span>.</p>
            <form id="intention-form">
                <textarea id="reason" name="reason" rows="3" autofocus></textarea>
                <button type="submit">Proceed</button>
            </form>
        </main>
    </div>
    <script src="block.js"></script>
</body>
</html>
